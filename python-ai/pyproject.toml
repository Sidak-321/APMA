[project]
name = "apma-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "tabulate>=0.9",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]